[package]
name = "rustychain"
version = "0.0.1"
edition = "2024"
description = "A Rust library for building LLM-powered applications"
license = "MIT"
homepage = "https://github.com/JeanVydes/rustychain"
repository = "https://github.com/JeanVydes/rustychain"
documentation = "https://docs.rs/rustychain"
readme = "README.md"
keywords = ["llm", "ai", "agent"]
categories = ["api-bindings", "asynchronous", "database"]
authors = ["Jean Vydes <j@lojur.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.1.0"
thiserror = "2.0.17"
arrayvec = "0.7.2"

# Logging
log = "0.4.20"

# Async and Futures
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"

# LLM Providers
openai-api-rs = { version = "9.0.0", optional = true }
gemini-rust = { version = "1.5.1", optional = true }
ollama-rs = { version = "0.3.3", features = ["stream"], optional = true }

# Tools
urlencoding = { version = "2.1.3", optional = true }
scraper = { version = "0.25.0", optional = true }
reqwest = { version = "0.12.25", features = [
    "json",
    "cookies",
], optional = true }
rand = "0.9.2"
fastrand = "2.3"

# Util
url = "2.5.7"
base64 = "0.22.1"
rustychain-macros = { path = "./macros", optional = true }

# Vector Store
pgvector = { version = "0.4.1", features = ["sqlx"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
] }

# Experimental - Native Audio Processing
[target.'cfg(target_os = "linux")'.dependencies]
rodio = { version = "0.21.1", optional = true }
cpal = { version = "0.16.0", optional = true }
webrtc-vad = { version = "0.4.0", optional = true }

[features]
default = []
audio = ["cpal", "rodio", "webrtc-vad"]
postgres = ["sqlx/postgres", "pgvector/sqlx"]
openai = ["openai-api-rs"]
google = ["gemini-rust"]
ollama = ["ollama-rs"]
anthropic = []
tools = ["reqwest", "scraper", "urlencoding"]
providers = ["openai", "google", "ollama"]
experimental = ["audio"]
macros = ["rustychain-macros"]
full = ["default", "postgres", "providers", "tools", "macros"]

[dev-dependencies]
testcontainers = "0.26.0"
pretty_assertions = "1.4"
rand = "0.9.2"
criterion = { version = "0.8.1", features = ["async_tokio"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
dotenvy = "0.15.6"
mockito = "1.2.0"

[[bench]]
name = "vector_store"
harness = false

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["providers"]

[[example]]
name = "chain"
path = "examples/chain.rs"
required-features = ["providers", "macros"]

[[example]]
name = "embedding"
path = "examples/embedding.rs"
required-features = ["providers", "postgres", "macros"]

[[example]]
name = "streaming"
path = "examples/streaming.rs"
required-features = ["providers"]

[[example]]
name = "tools"
path = "examples/tools.rs"
required-features = ["tools"]

[[example]]
name = "custom_tool"
path = "examples/custom_tool.rs"
required-features = ["tools", "macros", "providers"]

[[example]]
name = "full_custom_tools"
path = "examples/full_custom_tools.rs"
required-features = ["tools", "macros", "providers"]
