[package]
name = "rustychain"
version = "0.0.1"
edition = "2024"
description = "A Rust library for building LLM-powered applications"
license = "MIT"
homepage = "https://github.com/JeanVydes/rustychain"
repository = "https://github.com/JeanVydes/rustychain"
documentation = "https://docs.rs/rustychain"
readme = "README.md"
keywords = ["llm", "ai", "agent"]
categories = ["api-bindings", "asynchronous", "database"]
authors = ["Jean Vides <j@lojur.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.1.0"
thiserror = "2.0.17"
arrayvec = "0.7.2"
uuid = { version = "1", features = ["v4"] }

# Logging
log = "0.4.20"

# Async and Futures
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.89"

# LLM Providers
openai-api-rs = { version = "9.0.0", optional = true }
gemini-rust = { version = "1.5.1", optional = true }
ollama-rs = { version = "0.3.3", features = ["stream"], optional = true }
mongodb = { version = "2.5.0", optional = true }

# Tools
urlencoding = { version = "2.1.3", optional = true }
scraper = { version = "0.25.0" }
reqwest = { version = "0.12.25", features = [
    "json",
    "cookies",
], optional = true }
rand = "0.9.2"
fastrand = "2.3"
chrono = { version = "0.4", optional = true }
chrono-tz = { version = "0.10.4", optional = true }
hex = { version = "0.4.3", optional = true }
sha2 = { version = "0.10.8", optional = true }
argon2 = { version = "0.5.3", optional = true }
aes-gcm = { version = "0.10.3", optional = true }
similar = { version = "2.7.0", optional = true }
trust-dns-resolver = { version = "0.23.2", optional = true }
meval = { version = "0.2.0", optional = true }
regex = { version = "*", optional = true }
lettre = { version = "0.11.9", features = ["builder"], optional = true }
bson = { version = "2.5.0", optional = true }

# Util
url = "2.5.7"
base64 = "0.22.1"
rustychain-macros = { path = "./macros", optional = true }

# Storage
qdrant-client = { version = "1.16.0", optional = true }
pgvector = { version = "0.4.1", features = ["sqlx"], optional = true }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
], optional = true }

# Experimental - Native Audio Processing
[target.'cfg(target_os = "linux")'.dependencies]
rodio = { version = "0.21.1", optional = true }
cpal = { version = "0.16.0", optional = true }
webrtc-vad = { version = "0.4.0", optional = true }

[features]
default = []
templates = []
audio = ["dep:cpal", "dep:rodio", "dep:webrtc-vad"]

sql = ["dep:sqlx"]
postgres = ["sql", "sqlx/postgres", "dep:pgvector"]
qdrant = ["dep:qdrant-client"]
lancedb = []
mongodb = ["dep:mongodb", "dep:bson"]
s3vector = []
surrealdb = []

memory_store = []
vector_store = ["postgres", "qdrant", "lancedb", "mongodb", "s3vector", "surrealdb"]
persistent_storage = ["vector_store"]
storage = ["memory_store", "persistent_storage"]

openai = ["openai-api-rs"]
google = ["gemini-rust"]
ollama = ["ollama-rs"]
anthropic = []
aws = []
providers = ["openai", "google", "ollama", "anthropic", "aws"]

# Web & Network
http = ["dep:reqwest", "dep:urlencoding"]
scraping = ["http"] # scraper ya está por defecto, pero http es opcional
email = ["dep:lettre"]
dns = ["dep:trust-dns-resolver"]

# Security
hash = ["dep:sha2", "dep:hex"]
password = ["hash", "dep:argon2"]
encryption = ["dep:aes-gcm", "dep:hex"]
crypto = ["password", "encryption"]

# Data Processing
datetime = ["dep:chrono", "dep:chrono-tz"]
math = ["dep:meval"]
search = ["dep:regex", "dep:similar"]

tools = [
    "http",
    "scraping",
    "email",
    "dns",
    "crypto",
    "datetime",
    "math",
    "search",
    "vector_store",
]

experimental = ["audio"]
macros = ["rustychain-macros"]
essential = ["default", "providers", "macros"]
full = ["essential", "tools", "storage", "templates"]

[dev-dependencies]
testcontainers = "0.26.0"
pretty_assertions = "1.4"
rand = "0.9.2"
criterion = { version = "0.8.1", features = ["async_tokio"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
dotenvy = "0.15.6"
mockito = "1.2.0"
lazy_static = "1.5.0"

[[example]]
name = "agent"
path = "examples/agent.rs"
required-features = ["full"]

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["essential"]

[[example]]
name = "chain"
path = "examples/chain.rs"
required-features = ["essential"]

[[example]]
name = "custom_tool"
path = "examples/custom_tool.rs"
required-features = ["essential"]

[[example]]
name = "embedding"
path = "examples/embedding.rs"
required-features = ["essential"]

[[example]]
name = "full_custom_tools"
path = "examples/full_custom_tools.rs"
required-features = ["full"]

[[example]]
name = "inference"
path = "examples/inference.rs"
required-features = ["essential"]

[[example]]
name = "streaming"
path = "examples/streaming.rs"
required-features = ["essential"]

[[example]]
name = "tools"
path = "examples/tools.rs"
required-features = ["full"]
